name: Daily Morning Brief
on:
  schedule:
    # Runs at 9:00 AM IST (3:30 AM UTC) every day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Morning Brief
        env:
          # Required
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional — AI summary (falls back to plain text if missing)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional — Telegram delivery (prints to logs if missing)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Optional — your name in the message
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python -m app.morning_brief